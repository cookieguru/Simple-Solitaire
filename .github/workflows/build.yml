name: Build app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          cache: gradle
          distribution: 'temurin'
          java-version: 11

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-platform-28-build-tools-28.0.3

      - name: Set up Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          cp -r /usr/local/lib/android/sdk/licenses "$ANDROID_HOME/"
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::The DEBUG_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build
        run: |
          # The project has no native code; the runner's NDK only causes a warning
          unset ANDROID_NDK_HOME
          ./gradlew assembleRelease
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="simple-solitaire-$SHORT_SHA.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          git log -1 --format=%B > notes.txt
          # A manual re-run of an already released commit replaces the APK
          if gh release view "$SHORT_SHA" > /dev/null 2>&1; then
            gh release upload "$SHORT_SHA" "$apk" --clobber
          else
            gh release create "$SHORT_SHA" "$apk" --title "$SHORT_SHA" --target "$GITHUB_SHA" --notes-file notes.txt
          fi
